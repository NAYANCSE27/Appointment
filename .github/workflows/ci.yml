name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  api-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: medibook_test
          POSTGRES_USER: medibook
          POSTGRES_PASSWORD: password
        ports: ["5432:5432"]
      redis:
        image: redis:7
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm ci
      - run: cd apps/api && npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://medibook:password@localhost:5432/medibook_test
      - run: npm run lint
      - run: npm run test
        env:
          DATABASE_URL: postgresql://medibook:password@localhost:5432/medibook_test
          REDIS_URL: redis://localhost:6379
          JWT_ACCESS_SECRET: test-secret-min-64-chars-aaaabbbbccccddddeeeeffffgggg
          JWT_REFRESH_SECRET: test-refresh-secret-min-64-chars-aaaabbbbccccddddeeeeffff
